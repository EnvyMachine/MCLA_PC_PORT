# XMA decoder MMIO (apu/xma.cpp): the only instructions touching side-effecting
# XMA registers. Writes are `stwbrx r5, 0, r4` (r4 = register address).
[[midasm_hook]]
name = "XmaRegisterWriteHook" # clear (0x6A0+n), in the XMACreateContext wrapper
address = 0x823EDD6C
registers = ["r4", "r5"]
after_instruction = true

[[midasm_hook]]
name = "XmaRegisterWriteHook" # lock (0x690+n)
address = 0x823EDE04
registers = ["r4", "r5"]
after_instruction = true

[[midasm_hook]]
name = "XmaRegisterWriteHook" # kick (0x650+n)
address = 0x823EE13C
registers = ["r4", "r5"]
after_instruction = true

[[midasm_hook]]
name = "XmaCurrentContextReadHook" # before `lwbrx` of CurrentContextIndex (0x606)
address = 0x823EDF34
registers = []

# Shader capture (MCLA/gpu/shader_registry.cpp): right after RAGE's calls to
# D3D's shader create functions (sub_82418210, sub_82418100) return.
[[midasm_hook]]
name = "PixelShaderCreatedHook" # exit of D3D's pixel shader create: r3 = object (0 on failure), r27 = container + virtual size
address = 0x82418208
registers = ["ctx"]

[[midasm_hook]]
name = "VertexShaderCreatedHook" # exit of D3D's vertex shader create: r3 = object (0 on failure), r28 = container + virtual size
address = 0x824182F8
registers = ["ctx"]

[[midasm_hook]]
name = "InlineShaderCopyHook_824243F4" # vertex shader copied inline: r26 = copy, r28 = source
address = 0x824243F4
registers = ["ctx"]

