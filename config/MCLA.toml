# XenonRecomp configuration for Midnight Club: Los Angeles - Complete Edition
# (default.xex, title 545407F8, XDK 2.0.6995, original PE name mc4_xenon_final.exe)
# Paths are relative to this file.

[main]
file_path = "../extracted/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "MCLA_switch_tables.toml"

# Keep all optimizations off until the recompilation actually runs.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers (each byte pattern matched exactly once; tools/find_helpers.py)
restgprlr_14_address = 0x823D9210
savegprlr_14_address = 0x823D91C0
restfpr_14_address = 0x823DB9EC
savefpr_14_address = 0x823DB9A0
restvmx_14_address = 0x823DD558
savevmx_14_address = 0x823DD2C0
restvmx_64_address = 0x823DD5EC
savevmx_64_address = 0x823DD354

# setjmp/longjmp: not linked into this executable (no register-dump routines found).

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
    { data = 0x827BCF04, size = 8 }, # __C_specific_handler scope data (31 functions use SEH)
]

