# Midnight Club: Los Angeles - PC port settings.
# Put a '#' in front of a line to turn it off, remove it to turn it on.

# Start in borderless fullscreen. Turn off to start in a window.
# (In game: F11 or Alt+Enter toggles; in fullscreen, point at the top middle of the
# screen for the bar with "Exit full screen".)
MCLA_FULLSCREEN=1

# Audio volume, 0.0 to 2.0 (1.0 = normal).
#MCLA_VOLUME=1.0

# Mute all audio.
#MCLA_NO_AUDIO=1

# Seconds before an idle mouse cursor hides over the game (0 = never).
#MCLA_CURSOR_HIDE_SECONDS=2

# The original full-screen speed blur is off; set to 1 to turn it back on.
#MCLA_MOTION_BLUR=1

# Allow tearing (presents immediately instead of on the next display refresh).
#MCLA_TEARING=1

# Keep saves somewhere else than .\userdata.
#MCLA_USERDATA=C:\path\to\folder
